<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2f6f4">
    <meta name="description" content="I11L Tech offers cloud solutions, Azure services, and software and data engineering.">
    <title>I11L Tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --paper: #f2f6f4;
        --ink: #172c29;
        --muted: #61726e;
        --line: #cbd7d2;
        --accent: #e66045;
        --green: #176d57;
        --mono: "DM Mono", monospace;
        --display: "Space Grotesk", sans-serif;
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--display);
        -webkit-font-smoothing: antialiased;
      }

      a { color: inherit; }

      .page-shell {
        width: min(100% - 48px, 1120px);
        margin-inline: auto;
      }

      .site-header {
        min-height: 84px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
      }

      .wordmark {
        font-size: 20px;
        font-weight: 700;
        text-decoration: none;
      }

      .wordmark span { color: var(--accent); }

      .header-link {
        font-family: var(--mono);
        font-size: 12px;
        text-decoration-thickness: 1px;
        text-underline-offset: 5px;
      }

      .intro {
        padding: 72px 0 48px;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--green);
        font: 500 12px/1.4 var(--mono);
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        max-width: 780px;
        margin: 0;
        font-size: 132px;
        font-weight: 600;
        letter-spacing: 0;
        line-height: 0.92;
      }

      h1 span { color: var(--accent); }

      .image-band {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 5;
        overflow: hidden;
        background: #25463c;
      }

      .image-band img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 47%;
      }

      .image-caption {
        position: absolute;
        right: 16px;
        bottom: 14px;
        padding: 7px 10px;
        background: var(--paper);
        color: var(--ink);
        font: 11px/1 var(--mono);
      }

      .services {
        display: grid;
        grid-template-columns: minmax(180px, 0.8fr) 2fr;
        gap: 48px;
        padding: 64px 0 72px;
        border-bottom: 1px solid var(--line);
      }

      h2 {
        margin: 0;
        font-size: 24px;
        font-weight: 500;
        line-height: 1.2;
      }

      .service-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .service-list li {
        display: grid;
        grid-template-columns: 36px 1fr;
        gap: 12px;
        align-items: baseline;
        padding: 15px 0;
        border-top: 1px solid var(--line);
        font-size: 25px;
        font-weight: 500;
      }

      .service-list li:last-child { border-bottom: 1px solid var(--line); }

      .service-list span {
        color: var(--accent);
        font: 12px/1 var(--mono);
      }

      .site-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 28px 0 36px;
      }

      .contact-label {
        margin: 0;
        color: var(--muted);
        font: 12px/1.5 var(--mono);
        text-transform: uppercase;
      }

      .email {
        color: var(--green);
        font-size: 19px;
        font-weight: 500;
        text-decoration-thickness: 1px;
        text-underline-offset: 5px;
        overflow-wrap: anywhere;
      }

      @media (max-width: 640px) {
        .page-shell { width: min(100% - 36px, 1120px); }
        .site-header { min-height: 70px; }
        .intro { padding: 56px 0 36px; }
        h1 { font-size: 64px; }
        .image-band { aspect-ratio: 16 / 7; }
        .services { grid-template-columns: 1fr; gap: 24px; padding: 44px 0 52px; }
        .service-list li { font-size: 20px; }
        .email { font-size: 16px; }
        .site-footer { align-items: flex-start; flex-direction: column; gap: 9px; }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="wordmark" href="#top" aria-label="I11L Tech home">I11L<span>.</span></a>
        <a class="header-link" href="#contact">Get in touch</a>
      </header>

      <main id="top">
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow">Technology services</p>
          <h1 id="page-title">I11L <span>Tech</span></h1>
        </section>

        <figure class="image-band">
          <img
            src="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1800&q=85"
            alt="Detailed view of a computer circuit board"
            fetchpriority="high"
          >
          <figcaption class="image-caption">Technology, thoughtfully engineered</figcaption>
        </figure>

        <section class="services" id="services" aria-labelledby="services-title">
          <div>
            <p class="eyebrow">What we do</p>
            <h2 id="services-title">Services offered</h2>
          </div>
          <ul class="service-list">
            <li><span>01</span>Cloud Solutions</li>
            <li><span>02</span>Azure Services</li>
            <li><span>03</span>Software &amp; Data Engineering</li>
          </ul>
        </section>
      </main>

      <footer class="site-footer" id="contact">
        <p class="contact-label">Contact</p>
        <a class="email" href="mailto:santkunj@outlook.com">santkunj@outlook.com</a>
      </footer>
    </div>
  </body>
</html>
